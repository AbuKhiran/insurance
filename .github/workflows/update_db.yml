name: Update Database Automatically

on:
  push:
    paths:
      - 'Globmed.xlsx'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Run Processing Script
        run: |
          python -c "
          import pandas as pd
          import json
          import re

          def clean_str(val):
              if pd.isna(val):
                  return ''
              s = str(val).strip()
              s = re.sub(r'\s+', ' ', s)
              return s

          xls = pd.ExcelFile('Globmed.xlsx')
          all_data = []

          for city in xls.sheet_names:
              clean_city = clean_str(city)
              df = pd.read_excel('Globmed.xlsx', sheet_name=city, header=None)
              current_category = 'الأطباء'
              current_specialty = 'عام'
              
              for index, row in df.iterrows():
                  col0 = clean_str(row.iloc[0]) if len(row) > 0 else ''
                  col1 = clean_str(row.iloc[1]) if len(row) > 1 else ''
                  col2 = clean_str(row.iloc[2]) if len(row) > 2 else ''
                  col3 = clean_str(row.iloc[3]) if len(row) > 3 else ''
                  
                  # Skip city name header
                  if clean_city in col0 and not col1 and not col2 and not col3:
                      continue
                      
                  # Check if main category header
                  if col0 and (not col1 or col1 == 'nan') and (not col2 or col2 == 'nan') and (not col3 or col3 == 'nan'):
                      if any(term in col0 for term in ['الأطباء', 'الاطباء', 'الصيدليات', 'الصيدلي', 'المختبرات', 'المراكز', 'مراكز', 'المستشفيات', 'الأشعة', 'العلاج']):
                          if 'صيدلي' in col0 or 'الصيدلي' in col0:
                              current_category = 'الصيدليات'
                          elif 'مختبر' in col0:
                              current_category = 'المختبرات الطبية'
                          elif 'مستشفى' in col0:
                              current_category = 'المستشفيات'
                          elif 'مركز' in col0 or 'مراكز' in col0:
                              current_category = col0
                          else:
                              current_category = 'الأطباء'
                          current_specialty = 'عام'
                          continue
                          
                  # If row is the table header containing 'العنوان'
                  if 'العنوان' in col1 or 'الهاتف' in col2 or 'الجوال' in col3:
                      # The row right above this table header in col0 is the precise sub-specialty or category!
                      # Let's check previous row or col0 if it was captured
                      continue
                      
                  # If col0 has text and col1 is 'العنوان', wait, in Globmed.xlsx sub-specialty is the row before 'العنوان'
                  # Let's check if col1 has 'العنوان' -> the sub-specialty was col0 of the previous row or current row if structured so.
                  # Actually in Globmed, row has col0 = specialty name, col1 = 'العنوان', col2 = 'الهاتف', col3 = 'الجوال'
                  if 'العنوان' in col1:
                      current_specialty = col0 if col0 else current_specialty
                      continue
                      
                  # Provider record
                  if col0 and col0 != 'nan' and (col1 or col2 or col3):
                      # If col0 is a sub-specialty header (no address/phones)
                      if (not col1 or col1 == 'nan') and (not col2 or col2 == 'nan') and (not col3 or col3 == 'nan'):
                          current_specialty = col0
                          continue
                          
                      record = {
                          'city': clean_city,
                          'category': current_category,
                          'specialty': current_specialty if current_specialty and current_specialty != 'عام' else current_category,
                          'name': col0,
                          'address': col1 if col1 != 'nan' else '',
                          'phone': col2 if col2 != 'nan' else '',
                          'mobile': col3 if col3 != 'nan' else ''
                      }
                      all_data.append(record)

          # Remove duplicates
          unique_data = []
          seen = set()
          for item in all_data:
              identifier = (item['city'], item['name'], item['address'], item['phone'], item['mobile'])
              if identifier not in seen:
                  seen.add(identifier)
                  unique_data.append(item)

          with open('database.json', 'w', encoding='utf-8') as f:
              json.dump(unique_data, f, ensure_ascii=False, indent=4)
          print(f'Processed {len(unique_data)} unique records.')
          "

      - name: Commit and push database.json
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add database.json
          git commit -m 'Auto-update and clean database with correct specialties' || exit 0
          git push
