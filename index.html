<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل الشبكة الطبية المتطور</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --accent: #38bdf8;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 14px;
        }
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        
        header { text-align: center; margin-bottom: 35px; padding-top: 10px; }
        header h2 { color: var(--text-main); font-size: 30px; margin-bottom: 8px; font-weight: 800; letter-spacing: -0.5px; }
        header p { color: var(--text-muted); font-size: 15px; margin: 0; }
        
        .filters-container { background: white; padding: 24px; border-radius: var(--radius); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); margin-bottom: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; border: 1px solid var(--border); }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        
        input, select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; box-sizing: border-box; font-size: 14px; background: #fdfdfd; outline: none; transition: all 0.2s ease; color: var(--text-main); }
        input:focus, select:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1); }
        
        .results-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 14px; color: var(--text-muted); font-weight: 600; padding: 0 5px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); padding: 22px; border-radius: var(--radius); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); transition: all 0.25s ease; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.08); border-color: var(--accent); }
        
        .card-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
        .icon-box { width: 48px; height: 48px; border-radius: 12px; background: #e0f2fe; color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
        .info-area { flex: 1; }
        .info-area h3 { margin: 0 0 6px; font-size: 17px; color: var(--text-main); font-weight: 700; line-height: 1.4; }
        
        .tags-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .tag { font-size: 11px; background: #f1f5f9; color: var(--text-muted); padding: 3px 9px; border-radius: 6px; font-weight: 600; }
        .tag.city { background: #e2e8f0; color: #334155; }
        .tag.specialty { background: #e0f2fe; color: var(--primary-dark); }
        .tag.sub-specialty { background: #dcfce7; color: #166534; }
        
        .card-body { font-size: 13.5px; color: var(--text-muted); line-height: 1.7; border-top: 1px solid var(--border); padding-top: 14px; margin-top: 4px; }
        .card-body p { margin: 4px 0; display: flex; align-items: center; gap: 6px; }
        
        .card-footer { margin-top: 18px; padding-top: 12px; border-top: 1px dashed var(--border); display: flex; gap: 10px; }
        .btn { flex: 1; padding: 10px; border-radius: 10px; text-align: center; font-size: 13px; font-weight: 600; text-decoration: none; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-call { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .btn-call:hover { background: #dcfce7; }
        .btn-disabled { background: #f8fafc; color: #cbd5e1; border: 1px solid var(--border); cursor: not-allowed; }
        
        .load-more { display: block; width: 100%; max-width: 280px; margin: 40px auto; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; text-align: center; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); }
        .load-more:hover { background: var(--primary-dark); transform: translateY(-1px); }
        
        .no-results { text-align: center; padding: 50px; color: var(--text-muted); background: white; border-radius: var(--radius); grid-column: 1 / -1; border: 1px solid var(--border); font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>دليل الشبكة الطبية</h2>
        <p>منصة بحث ذكية وسريعة للوصول إلى مقدمي الخدمات الطبية</p>
    </header>
    
    <div class="filters-container">
        <div class="filter-group">
            <label>المدينة</label>
            <select id="cityFilter" onchange="handleFilterChange()">
                <option value="">جميع المدن</option>
            </select>
        </div>
        <div class="filter-group">
            <label>التصنيف الرئيسي</label>
            <select id="categoryFilter" onchange="handleFilterChange()">
                <option value="">جميع التصنيفات</option>
            </select>
        </div>
        <div class="filter-group">
            <label>التخصص الفرعي / الفئة</label>
            <select id="specialtyFilter" onchange="handleFilterChange()">
                <option value="">جميع التخصصات</option>
            </select>
        </div>
        <div class="filter-group">
            <label>بحث حر</label>
            <input type="text" id="searchInput" oninput="handleSearchInput()" placeholder="ابحث بالاسم أو العنوان...">
        </div>
    </div>

    <div class="results-meta">
        <span id="resultsCount">جاري تحميل البيانات...</span>
    </div>

    <div id="resultsGrid" class="grid"></div>
    <button id="loadMoreBtn" class="load-more" style="display: none;" onclick="loadMoreResults()">عرض المزيد من النتائج</button>
</div>

<script>
    let globalData = [];
    let filteredData = [];
    let displayedCount = 0;
    const pageSize = 24;
    let searchTimeout = null;

    // دالة لتنظيف وتوحيد النصوص وإزالة المسافات الزائدة
    function cleanText(text) {
        if (!text) return "";
        return text.replace(/\s+/g, ' ').trim();
    }

    fetch('database.json')
        .then(response => response.json())
        .then(rawdata => {
            // تنظيف البيانات عند التحميل لمنع التكرار الناجم عن المسافات الفاصلة
            globalData = rawdata.map(item => ({
                city: cleanText(item.city),
                category: cleanText(item.category),
                specialty: cleanText(item.specialty),
                name: cleanText(item.name),
                address: cleanText(item.address),
                phone: cleanText(item.phone),
                mobile: cleanText(item.mobile)
            }));
            
            filteredData = globalData;
            populateDropdowns();
            renderResults(true);
        })
        .catch(err => {
            document.getElementById('resultsGrid').innerHTML = "<div class='no-results'>عذراً، يرجى التأكد من توليد ملف database.json بنجاح.</div>";
        });

    function populateDropdowns() {
        const cities = [...new Set(globalData.map(item => item.city))].filter(Boolean).sort();
        const categories = [...new Set(globalData.map(item => item.category))].filter(Boolean).sort();
        const specialties = [...new Set(globalData.map(item => item.specialty))].filter(Boolean).sort();

        fillSelect('cityFilter', cities, 'جميع المدن');
        fillSelect('categoryFilter', categories, 'جميع التصنيفات');
        fillSelect('specialtyFilter', specialties, 'جميع التخصصات');
    }

    function fillSelect(elementId, items, defaultText) {
        const select = document.getElementById(elementId);
        select.innerHTML = `<option value="">${defaultText}</option>`;
        items.forEach(item => {
            if(item && item !== 'عام') {
                let opt = document.createElement('option');
                opt.value = item;
                opt.innerHTML = item;
                select.appendChild(opt);
            }
        });
    }

    function handleSearchInput() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => filterData(), 200);
    }

    function handleFilterChange() {
        filterData();
    }

    function filterData() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const selectedCity = document.getElementById('cityFilter').value;
        const selectedCategory = document.getElementById('categoryFilter').value;
        const selectedSpecialty = document.getElementById('specialtyFilter').value;

        filteredData = globalData.filter(item => {
            if (selectedCity && item.city !== selectedCity) return false;
            if (selectedCategory && item.category !== selectedCategory) return false;
            if (selectedSpecialty && item.specialty !== selectedSpecialty) return false;
            
            if (query === "") return true;

            return item.name.toLowerCase().includes(query) || 
                   item.address.toLowerCase().includes(query) || 
                   item.specialty.toLowerCase().includes(query) ||
                   item.category.toLowerCase().includes(query) ||
                   item.phone.includes(query) || 
                   item.mobile.includes(query);
        });

        renderResults(true);
    }

    function getCardMeta(category, specialty) {
        let icon = "🏥";
        let subTag = "";
        
        const lowerCat = category.toLowerCase();
        const lowerSpec = specialty.toLowerCase();

        if (lowerCat.includes('أطباء') || lowerCat.includes('طبيب') || lowerCat.includes('الاطباء')) {
            icon = "🩺";
        } else if (lowerCat.includes('صيدلي') || lowerCat.includes('صيدليات')) {
            icon = "💊";
        } else if (lowerCat.includes('مستشفى') || lowerCat.includes('مستشفيات')) {
            icon = "🏨";
        } else if (lowerCat.includes('مختبر') || lowerCat.includes('تحاليل')) {
            icon = "🔬";
        } else if (lowerCat.includes('بصريات') || lowerCat.includes('نظارات')) {
            icon = "👓";
        }

        // كشف التخصصات الفرعية الحساسة مثل أطفال أو نساء
        if (lowerSpec.includes('أطفال') || lowerSpec.includes('الاطفال')) {
            subTag = "👶 أطفال";
        } else if (lowerSpec.includes('نساء') || lowerSpec.includes('توليد')) {
            subTag = "👩‍🍼 نساء وولادة";
        } else if (lowerSpec.includes('أسنان') || lowerSpec.includes('الاسنان')) {
            subTag = "🦷 أسنان";
        }

        return { icon, subTag };
    }

    function renderResults(reset = false) {
        const grid = document.getElementById('resultsGrid');
        const countContainer = document.getElementById('resultsCount');
        const loadMoreBtn = document.getElementById('loadMoreBtn');

        if (reset) {
            grid.innerHTML = "";
            displayedCount = 0;
        }

        countContainer.innerHTML = `عدد النتائج المطابقة: <strong>${filteredData.length}</strong>`;

        if (filteredData.length === 0) {
            grid.innerHTML = "<div class='no-results'>لا توجد نتائج مطابقة لبحثك.</div>";
            loadMoreBtn.style.display = "none";
            return;
        }

        const nextBatch = filteredData.slice(displayedCount, displayedCount + pageSize);
        let htmlContent = "";

        nextBatch.forEach(item => {
            const { icon, subTag } = getCardMeta(item.category, item.specialty);
            const contactNumber = item.mobile || item.phone;

            htmlContent += `
                <div class="card">
                    <div>
                        <div class="card-header">
                            <div class="icon-box">${icon}</div>
                            <div class="info-area">
                                <h3>${item.name}</h3>
                                <div class="tags-container">
                                    <span class="tag city">${item.city}</span>
                                    <span class="tag">${item.category}</span>
                                    ${item.specialty && item.specialty !== 'عام' ? `<span class="tag specialty">${item.specialty}</span>` : ''}
                                    ${subTag ? `<span class="tag sub-specialty">${subTag}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="card-body">
                            <p>📍 <strong>العنوان:</strong> ${item.address || 'العنوان غير متوفر'}</p>
                            <p>📞 <strong>هاتف:</strong> ${item.phone || 'لا يوجد'}</p>
                            <p>📱 <strong>جوال:</strong> ${item.mobile || 'لا يوجد'}</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        ${contactNumber ? `<a href="tel:${contactNumber}" class="btn btn-call">📞 اتصال مباشر</a>` : `<span class="btn btn-disabled">لا يوجد رقم</span>`}
                    </div>
                </div>
            `;
        });

        if (reset) {
            grid.innerHTML = htmlContent;
        } else {
            grid.innerHTML += htmlContent;
        }

        displayedCount += nextBatch.length;

        if (displayedCount < filteredData.length) {
            loadMoreBtn.style.display = "block";
        } else {
            loadMoreBtn.style.display = "none";
        }
    }

    function loadMoreResults() {
        renderResults(false);
    }
</script>

</body>
</html>
